site_name: Streaming Semantic Fragments
site_description: A standard way to put live data on the web — streamed fragments, live self-description, push notifications, verifiable provenance. Plain HTTP only.
site_url: https://fab679.github.io/semantic-web
repo_url: https://github.com/fab679/semantic-web
repo_name: fabisch/semantic-web

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Start:
      - What this is: index.md
      - The problem and the idea: what-it-is.md
      - How it works: how-it-works.md
      - What it enables: what-it-enables.md
  - Standards:
      - Standards implemented: standards.md
      - Trust layer (provenance): trust.md
      - WebSub specification: WebSub.md
  - Running it:
      - Reference (endpoints + configuration): reference.md
      - Operations: operations.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list