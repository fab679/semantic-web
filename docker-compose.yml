# docker-compose.yml
# -------------------
# Production topology of the service in two containers:
#
#   oxigraph      -> the triple store, running standalone. Exposes the
#                    standard SPARQL 1.1 Protocol at /query and /update and
#                    the Graph Store Protocol at /store (used to load
#                    sample_data.ttl). Data persists in the named volume.
#
#   semantic-web  -> the service: TPF fragments streamed as NDJSON-LD,
#                    live self-description, spec-compliant WebSub hub
#                    (docs/WebSub.md). Talks to Oxigraph over the SPARQL
#                    1.1 Protocol, so the store and the service are
#                    separately restartable and the store is swappable
#                    for any conforming SPARQL endpoint.
#
# Start the stack:          docker compose up --build
# Watch the WebSub loop:    docker compose --profile demo up
#                           (subscribe demo-subscriber's callback:
#                            http://demo-subscriber:9000/callback,
#                            then watch `docker compose logs -f demo-subscriber`)
#
# The Oxigraph web UI is available at http://localhost:7878

services:
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:0.5.10
    # 0.5.x CLI is subcommand-based; bind must be 0.0.0.0 or the port
    # mapping never reaches the server (default is loopback-only).
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "7878:7878"
    volumes:
      - oxigraph-data:/data
    # NOTE: no healthcheck -- the Oxigraph image is distroless (no
    # shell/wget/curl to run one with). The service tolerates this:
    # load_seed retries while the store boots.

  semantic-web:
    build: .
    ports:
      - "8484:8000"
    # Directory app world (people + orgs; the shared foaf:name labels live here)
    volumes: [ "./demos/seed:/app/seed:ro" ]
    environment:
      SEMWEB_PORT: "8000"   # container-internal listener; host maps 8484->8000
      SEMWEB_SPARQL_ENDPOINT: http://oxigraph:7878/query
      SEMWEB_SPARQL_UPDATE: http://oxigraph:7878/update
      SEMWEB_PUBLIC_URL: http://localhost:8484
      SEMWEB_SEED_PATH: /app/seed/directory.ttl
      # Vocabulary: runtime prefixes for private namespaces + bare term
      # aliases (the "friendly names" layer -- operators choose, nothing
      # hardcoded). See docs/configuration.md.
      SEMWEB_EXTRA_PREFIXES: ${SEMWEB_EXTRA_PREFIXES:-}
      SEMWEB_TERM_ALIASES: ${SEMWEB_TERM_ALIASES:-name=http://xmlns.com/foaf/0.1/name,knows=http://xmlns.com/foaf/0.1/knows,employer=http://schema.org/worksFor,employs=http://schema.org/employee,founded=http://schema.org/foundingDate}
      # Federation: open-hub policy + external hub fan-out (see docs/federation.md)
      SEMWEB_OPEN_HUB: ${SEMWEB_OPEN_HUB:-0}
      SEMWEB_HUB_URLS: ${SEMWEB_HUB_URLS:-}
      # SHACL shapes -> SHAPES_GRAPH, surfaced by GET /manifest and /mcp.
      SEMWEB_SHACL_PATH: /app/shapes.ttl
      # Mutating endpoints (POST /admin/insert) require this bearer token.
      # Read endpoints stay open.
      SEMWEB_WRITE_TOKEN: demo-write-token
      SEMWEB_QUEUE_CAPACITY: "4096"
      SEMWEB_DELIVERY_WORKERS: "8"
      # Subscription-secret encryption at rest (recommended). 32 random
      # bytes, hex. `openssl rand -hex 32`.
      SEMWEB_SECRET_KEY: 5f4d3c2b1a0987654321fedcba9876543210fedcba9876543210abcdef123456
      # Trust layer (opt-in): signs the manifest; the verifying key is
      # served at /.well-known/did.json and readers verify with the
      # verify_claim machine tool (see docs/trust.md). Demo key --
      # generate your own with `openssl rand -hex 32`. Unset = unsigned surface (unchanged behavior).
      SEMWEB_SIGNING_KEY: ${SEMWEB_SIGNING_KEY:-7a3f5e9c1d8b4f2a6e0c9d5b8f1a3e7c2d4b6f8a0e9c1d3b5f7a9e1c3d5b7f9e}
      SEMWEB_DID: ${SEMWEB_DID:-}
      SEMWEB_TRUSTED_ISSUERS: ${SEMWEB_TRUSTED_ISSUERS:-}
      SEMWEB_TRUSTED_ISSUERS_PATH: ${SEMWEB_TRUSTED_ISSUERS_PATH:-}
      SEMWEB_REVOKED_CREDENTIAL_IDS: ${SEMWEB_REVOKED_CREDENTIAL_IDS:-}
      # Replica sharding: read SEMWEB_REPLICA_COUNT from the environment
      # (default 1). The `scale` profile's second replica fixes COUNT=2 /
      # INDEX=1, so `SEMWEB_REPLICA_COUNT=2 docker compose --profile scale up`
      # makes both replicas one 2-shard cluster sharing the store.
      SEMWEB_REPLICA_COUNT: ${SEMWEB_REPLICA_COUNT:-1}
      SEMWEB_REPLICA_INDEX: "0"
      RUST_LOG: info
    depends_on:
      - oxigraph
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- The multi-app federation demo ---------------------------------
  # Three apps, three stores, three hubs. Each app speaks its own
  # ontology; the shared intersection (foaf:name, rdf:type) is what lets
  # them interoperate. See demos/README.md.

  oxigraph-market:
    image: ghcr.io/oxigraph/oxigraph:0.5.10
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "7879:7878"
    volumes:
      - oxigraph-market-data:/data

  semantic-web-market:
    build: .
    ports:
      - "8486:8000"
    volumes: [ "./demos/seed:/app/seed:ro" ]
    environment:
      SEMWEB_PORT: "8000"
      SEMWEB_SPARQL_ENDPOINT: http://oxigraph-market:7878/query
      SEMWEB_SPARQL_UPDATE: http://oxigraph-market:7878/update
      SEMWEB_PUBLIC_URL: http://localhost:8486
      SEMWEB_SEED_PATH: /app/seed/market.ttl
      # The Market's own ontology, as a runtime prefix (no recompile).
      SEMWEB_EXTRA_PREFIXES: ${SEMWEB_MARKET_PREFIX:-mkt=http://harborlight.example/market#}
      SEMWEB_WRITE_TOKEN: demo-write-token
      SEMWEB_SECRET_KEY: 5f4d3c2b1a0987654321fedcba9876543210fedcba9876543210abcdef123456
      SEMWEB_SIGNING_KEY: ${SEMWEB_MARKET_SIGNING_KEY:-2c4a6e8f0b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e7b9d1f3a}
      RUST_LOG: info
    depends_on:
      - oxigraph-market
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 5s
      retries: 12

  oxigraph-board:
    image: ghcr.io/oxigraph/oxigraph:0.5.10
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "7880:7878"
    volumes:
      - oxigraph-board-data:/data

  semantic-web-board:
    build: .
    ports:
      - "8487:8000"
    volumes: [ "./demos/seed:/app/seed:ro" ]
    environment:
      SEMWEB_PORT: "8000"
      SEMWEB_SPARQL_ENDPOINT: http://oxigraph-board:7878/query
      SEMWEB_SPARQL_UPDATE: http://oxigraph-board:7878/update
      SEMWEB_PUBLIC_URL: http://localhost:8487
      SEMWEB_SEED_PATH: /app/seed/board.ttl
      SEMWEB_EXTRA_PREFIXES: ${SEMWEB_BOARD_PREFIX:-brd=http://harborlight.example/board#}
      SEMWEB_WRITE_TOKEN: demo-write-token
      SEMWEB_SECRET_KEY: 5f4d3c2b1a0987654321fedcba9876543210fedcba9876543210abcdef123456
      SEMWEB_SIGNING_KEY: ${SEMWEB_BOARD_SIGNING_KEY:-4e6c8a0f2b4d6e8a0c2e4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e68}
      RUST_LOG: info
    depends_on:
      - oxigraph-board
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Optional: run a WebSub subscriber inside the docker network so the
  # full publish/subscribe loop can be exercised end to end with no host
  # networking involved:
  #   docker compose --profile demo up -d
  #   curl -X POST http://localhost:8484/hub \
  #     -d "hub.mode=subscribe" \
  #     -d "hub.topic=http://localhost:8484/topics/data" \
  #     -d "hub.callback=http://demo-subscriber:9000/callback" \
  #     -d "hub.secret=demo"
  #   docker compose logs -f demo-subscriber
  demo-subscriber:
    build: .
    command: ["/app/demo-subscriber"]
    environment:
      DEMO_SUBSCRIBER_PORT: "9000"
      SUBSCRIBER_SECRET: demo
      RUST_LOG: info
    profiles: ["demo"]
    depends_on:
      - semantic-web

  # Optional 2-replica sharding demo (with oxigraph shared):
  #   docker compose --profile scale up -d
  # Both replicas serve the same store; each delivers only the
  # subscriptions its consistent-hash shard owns. Watch:
  #   docker compose logs -f semantic-web-2
  semantic-web-2:
    build: .
    ports:
      - "8485:8000"
    environment:
      SEMWEB_PORT: "8000"
      SEMWEB_SPARQL_ENDPOINT: http://oxigraph:7878/query
      SEMWEB_SPARQL_UPDATE: http://oxigraph:7878/update
      SEMWEB_PUBLIC_URL: http://localhost:8485
      SEMWEB_SEED_PATH: /app/sample_data.ttl
      SEMWEB_WRITE_TOKEN: demo-write-token
      SEMWEB_SECRET_KEY: 5f4d3c2b1a0987654321fedcba9876543210fedcba9876543210abcdef123456
      # Same signing identity as replica 0 so both replicas attest as one.
      SEMWEB_SIGNING_KEY: ${SEMWEB_SIGNING_KEY:-7a3f5e9c1d8b4f2a6e0c9d5b8f1a3e7c2d4b6f8a0e9c1d3b5f7a9e1c3d5b7f9e}
      SEMWEB_REPLICA_COUNT: "2"
      SEMWEB_REPLICA_INDEX: "1"
      RUST_LOG: info
    profiles: ["scale"]
    depends_on:
      - oxigraph

volumes:
  oxigraph-data:
  oxigraph-market-data:
  oxigraph-board-data: